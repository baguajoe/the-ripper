name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24"
  # electron-builder: never try to sign or publish from CI
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - id: py
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: engine/requirements*.txt

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg xvfb

      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install ffmpeg

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install ffmpeg -y --no-progress
          echo "C:/ProgramData/chocolatey/bin" >> "$GITHUB_PATH"

      - name: Point the app and scripts at the CI Python
        run: echo "RIPPER_PYTHON=${{ steps.py.outputs.python-path }}" >> "$GITHUB_ENV"

      - name: Install Python dependencies
        run: |
          "$RIPPER_PYTHON" -m pip install --upgrade pip
          "$RIPPER_PYTHON" -m pip install -r engine/requirements.txt

      # Run the HQ (AI) Demucs test on one OS only (CPU torch is a big download).
      - name: Install CPU torch + Demucs (Linux)
        if: runner.os == 'Linux'
        run: |
          "$RIPPER_PYTHON" -m pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          "$RIPPER_PYTHON" -m pip install demucs==4.1.0

      - name: Cache Demucs weights
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ~/.cache/torch/hub
          key: demucs-weights-htdemucs-v1

      - name: Install Node dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build UI
        run: npm run build

      - name: Engine tests (pytest)
        run: npm run test:engine

      - name: UI unit tests (vitest)
        run: npm run test:ui

      - name: Desktop unit tests (tool resolver, logs)
        run: npm run test:desktop

      - name: End-to-end tests (Electron + Playwright, Linux with real X11 drags)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run e2e -w desktop

      - name: End-to-end tests (Electron + Playwright)
        if: runner.os != 'Linux'
        run: npm run e2e -w desktop

      - name: Smoke test
        run: bash scripts/smoke.sh

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ matrix.os }}
          path: desktop/test-results/
          if-no-files-found: ignore

  installers:
    name: Installer (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
            artifact: the-ripper-macos
            files: desktop/release/*.dmg
          - os: windows-latest
            script: dist:win
            artifact: the-ripper-windows
            files: desktop/release/*.exe
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - id: py
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: engine/requirements*.txt

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Python dependencies
        run: |
          echo "RIPPER_PYTHON=${{ steps.py.outputs.python-path }}" >> "$GITHUB_ENV"
          "${{ steps.py.outputs.python-path }}" -m pip install --upgrade pip
          "${{ steps.py.outputs.python-path }}" -m pip install -r engine/requirements.txt -r engine/requirements-build.txt

      - name: Install Node dependencies
        run: npm ci

      # ffmpeg + ffprobe + Deno into desktop/vendor/<os>/ (checksummed; see LICENSES.md)
      - name: Download bundled ffmpeg + Deno
        run: '"$RIPPER_PYTHON" scripts/fetch_vendor.py --check'

      - name: Build installer (UI + PyInstaller engine + electron-builder)
        run: npm run ${{ matrix.script }}

      - name: Installer size
        run: |
          {
            echo "### Installer (${{ runner.os }})"
            echo
            for f in ${{ matrix.files }}; do
              echo "- \`$(basename "$f")\`: **$(( $(wc -c < "$f") / 1048576 )) MB**"
            done
            echo "- bundled tools (uncompressed): $(du -shc desktop/vendor/ffmpeg/*/ff* desktop/vendor/deno/*/deno* | tail -1 | cut -f1)"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 30

      # --- Prove a clean machine works: install the real installer, then run the INSTALLED
      # app with ffmpeg, ffprobe, node and deno all absent from PATH.
      - name: Install (Windows, silent)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Install where a per-user install lands for a user named "J. Test" (space + period),
          # like C:\Users\J. Gallop\AppData\Local\Programs\the-ripper on the tester's PC.
          $dir = 'C:\Users\J. Test\AppData\Local\Programs\The Ripper'
          $inst = Get-ChildItem desktop/release/*.exe | Select-Object -First 1
          Start-Process -FilePath $inst.FullName -ArgumentList '/S', "/D=$dir" -Wait
          $exe = Get-ChildItem "$dir\*.exe" | Where-Object { $_.Name -notlike 'Uninstall*' } | Select-Object -First 1
          if (-not $exe) { Get-ChildItem -Recurse $dir | Select-Object -First 40; throw 'installed app not found' }
          "RIPPER_INSTALLED_APP=$($exe.FullName)" >> $env:GITHUB_ENV
          "RIPPER_INSTALLED_ENGINE=$dir\resources\engine\ripper-engine.exe" >> $env:GITHUB_ENV
          "RIPPER_TEST_HOME=C:\Users\J. Test" >> $env:GITHUB_ENV
          Get-ChildItem "$dir\resources\engine" -File | Format-Table Name, Length

      - name: Install (macOS, mount + copy to /Applications)
        if: runner.os == 'macOS'
        run: |
          dmg="$(ls desktop/release/*.dmg | head -1)"
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint /Volumes/ripper-install
          src="$(ls -d /Volumes/ripper-install/*.app | head -1)"
          echo "dmg contains: $(ls /Volumes/ripper-install)"
          # A home folder with a space and a period, like /Users/J. Gallop
          dest="$HOME/J. Test/Applications"
          mkdir -p "$dest"
          cp -R "$src" "$dest/"
          hdiutil detach /Volumes/ripper-install
          app="$dest/$(basename "$src")"
          echo "RIPPER_TEST_HOME=$HOME/J. Test" >> "$GITHUB_ENV"
          test -d "$app"
          echo "RIPPER_INSTALLED_APP=$(ls "$app"/Contents/MacOS/* | head -1)" >> "$GITHUB_ENV"
          echo "RIPPER_INSTALLED_ENGINE=$app/Contents/Resources/engine/ripper-engine" >> "$GITHUB_ENV"
          ls -l "$app/Contents/Resources/engine/" | grep -v "^d" | head -20
          # Simulate a download: files copied out of a downloaded dmg carry quarantine. The
          # app must clear it on its bundled helpers before running them.
          for b in ffmpeg ffprobe deno; do
            xattr -w com.apple.quarantine "0081;$(printf %x "$(date +%s)");Safari;" "$app/Contents/Resources/engine/$b"
          done

      - name: Strip ffmpeg, ffprobe, node and deno from PATH
        run: |
          echo "NODE_BIN=$(command -v node)" >> "$GITHUB_ENV"
          if [ "$RUNNER_OS" = Windows ]; then
            clean="/usr/bin:/mingw64/bin:/c/Windows/system32:/c/Windows:/c/Windows/System32/Wbem:/c/Windows/System32/WindowsPowerShell/v1.0"
          else
            clean="/usr/bin:/bin:/usr/sbin:/sbin"
          fi
          for t in ffmpeg ffprobe node deno; do
            if PATH="$clean" command -v "$t" >/dev/null; then echo "::error::$t is still on the clean PATH: $(PATH="$clean" command -v "$t")"; exit 1; fi
          done
          echo "CLEAN_PATH=$clean" >> "$GITHUB_ENV"
          echo "clean PATH: $clean (no ffmpeg, ffprobe, node or deno)"
          # Fixtures are made now (with the vendored ffmpeg), not by the tests on the clean PATH.
          "$RIPPER_PYTHON" -m engine.tests.fixtures
          ls -l engine/tests/fixtures/generated/

      - name: "Windows: report the runner's integrity level (elevation)"
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: whoami /groups | Select-String 'Mandatory Level'

      # Every installed-app test runs: from a "J. Test" install folder, with "J. Test" data/temp
      # folders (tests/helpers.js), on a simulated 24-core PC (24-thread settings in the
      # environment, 24 CPUs reported), with ffmpeg/ffprobe/node/deno absent from PATH.
      - name: "Clean machine: installed app end-to-end (Electron + Playwright)"
        working-directory: desktop
        env:
          RIPPER_TEST_CPU_COUNT: "24"
          OMP_NUM_THREADS: "24"
          OPENBLAS_NUM_THREADS: "24"
          MKL_NUM_THREADS: "24"
          NUMBA_NUM_THREADS: "24"
          VECLIB_MAXIMUM_THREADS: "24"
        run: |
          mkdir -p "$RIPPER_TEST_HOME/Temp"
          export TMPDIR="$RIPPER_TEST_HOME/Temp" TEMP="$RIPPER_TEST_HOME/Temp" TMP="$RIPPER_TEST_HOME/Temp"
          PATH="$CLEAN_PATH" RIPPER_E2E_EXECUTABLE="$RIPPER_INSTALLED_APP" RIPPER_E2E_EXPECT_BUNDLED=1 \
            "$NODE_BIN" ../node_modules/@playwright/test/cli.js test

      - name: "Clean machine: macOS quarantine was cleared on the bundled helpers"
        if: runner.os == 'macOS'
        run: |
          dir="$(dirname "$RIPPER_INSTALLED_ENGINE")"
          for b in ffmpeg ffprobe deno ripper-engine; do
            test -x "$dir/$b" || { echo "::error::$b is not executable"; exit 1; }
            if xattr -p com.apple.quarantine "$dir/$b" 2>/dev/null; then echo "::error::$b is still quarantined"; exit 1; fi
            codesign --verify "$dir/$b" && echo "$b: executable, not quarantined, signature ok"
          done

      - name: "Clean machine: installed engine smoke test (MP3 import → analyze → export kit)"
        env:
          RIPPER_TEST_CPU_COUNT: "24"
          OPENBLAS_NUM_THREADS: "24"
          NUMBA_NUM_THREADS: "24"
        run: PATH="$CLEAN_PATH" RIPPER_ENGINE_CMD="$RIPPER_INSTALLED_ENGINE" SMOKE_EXPECT_BUNDLED=1 bash scripts/smoke.sh

      # Uninstall must remove the user's library (a reinstall must start empty), while an
      # update installed over the top must keep it.
      - name: "Windows: update keeps the library, uninstall removes it"
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = 'C:\Users\J. Test\AppData\Local\Programs\The Ripper'
          $engineData = Join-Path $env:APPDATA 'TheRipper'
          $appData = Join-Path $env:APPDATA 'The Ripper'
          New-Item -ItemType Directory -Force "$engineData\storage\0123456789abcdef0123456789abcdef", $appData | Out-Null
          Set-Content "$engineData\storage\0123456789abcdef0123456789abcdef\meta.json" '{"id":"0123456789abcdef0123456789abcdef","title":"Old track","status":"ready"}'
          Set-Content "$appData\settings.json" '{}'
          # 1) install the same build again over the existing one = an update: data must stay
          $inst = Get-ChildItem desktop/release/*.exe | Select-Object -First 1
          Start-Process -FilePath $inst.FullName -ArgumentList '/S', "/D=$dir" -Wait
          Start-Sleep -Seconds 5
          if (-not (Test-Path "$engineData\storage\0123456789abcdef0123456789abcdef\meta.json")) { throw 'an update deleted the library' }
          if (-not (Test-Path "$appData\settings.json")) { throw 'an update deleted the settings' }
          Write-Host 'update over the top: library + settings kept'
          # 2) uninstall: data must be gone
          $un = Get-ChildItem "$dir\Uninstall*.exe" | Select-Object -First 1
          Start-Process -FilePath $un.FullName -ArgumentList '/S' -Wait
          for ($i = 0; $i -lt 60 -and ((Test-Path $engineData) -or (Test-Path $appData) -or (Test-Path "$dir\*.exe")); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $engineData) { Get-ChildItem -Recurse $engineData | Select-Object -First 20; throw "uninstall left $engineData behind" }
          if (Test-Path $appData) { throw "uninstall left $appData behind" }
          if (Test-Path "$dir\*.exe") { throw 'uninstall left the app behind' }
          Write-Host 'uninstall: app, library and settings removed'

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-installed-${{ matrix.os }}
          path: desktop/test-results/
          if-no-files-found: ignore

  # Tag push (v*): publish a GitHub release with both installers once everything is green.
  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: installers
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: the-ripper-*
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          notes="docs/release-notes/${GITHUB_REF_NAME}.md"
          [ -f "$notes" ] || { echo "Release ${GITHUB_REF_NAME}" > /tmp/notes.md; notes=/tmp/notes.md; }
          v="${GITHUB_REF_NAME#v}"
          (cd dist && zip -0 -q "The-Ripper-$v-Windows.zip" *.exe && zip -0 -q "The-Ripper-$v-macOS.zip" *.dmg)
          gh release create "$GITHUB_REF_NAME" dist/*.exe dist/*.dmg dist/*.zip --title "The Ripper ${GITHUB_REF_NAME}" --notes-file "$notes" --verify-tag
