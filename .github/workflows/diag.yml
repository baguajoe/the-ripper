name: diag-crash
on:
  push:
    branches: ["diag/**"]
jobs:
  win:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v5
      - id: py
        uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip, cache-dependency-path: engine/requirements*.txt }
      - run: |
          "${{ steps.py.outputs.python-path }}" -m pip install -r engine/requirements.txt -r engine/requirements-build.txt
          echo "PY=${{ steps.py.outputs.python-path }}" >> $GITHUB_ENV
      - run: '"$PY" scripts/fetch_vendor.py --check'
      - run: '"$PY" scripts/build_engine.py'
      - name: song
        run: |
          "$PY" scripts/diag_song.py song.wav
          desktop/vendor/ffmpeg/win/ffmpeg.exe -y -v error -i song.wav -b:a 192k song.mp3
          ls -l song.*
      - name: A frozen default
        continue-on-error: true
        run: |
          export RIPPER_BIN_DIR="$PWD/desktop/vendor/ffmpeg/win" RIPPER_APP_DATA="$PWD/appA"
          engine/dist/ripper-engine/ripper-engine.exe --analyze song.mp3; echo "exit=$?"; cat appA/engine-crash.log || true
      - name: B frozen 24 threads + J. Test profile
        continue-on-error: true
        shell: pwsh
        run: |
          $u = "C:\Users\J. Test"; New-Item -ItemType Directory -Force "$u\AppData\Roaming","$u\AppData\Local\Temp" | Out-Null
          $env:USERPROFILE=$u; $env:APPDATA="$u\AppData\Roaming"; $env:LOCALAPPDATA="$u\AppData\Local"; $env:TEMP="$u\AppData\Local\Temp"; $env:TMP=$env:TEMP
          $env:OPENBLAS_NUM_THREADS="24"; $env:OMP_NUM_THREADS="24"; $env:NUMBA_NUM_THREADS="24"; $env:MKL_NUM_THREADS="24"
          $env:RIPPER_BIN_DIR="$PWD\desktop\vendor\ffmpeg\win"
          Copy-Item song.mp3 "$u\song.mp3"
          & engine\dist\ripper-engine\ripper-engine.exe --analyze "$u\song.mp3"
          "exit=$LASTEXITCODE"
          Get-Content "$u\AppData\Roaming\TheRipper\engine-crash.log" -ErrorAction SilentlyContinue
      - name: C source python 24 threads
        continue-on-error: true
        run: |
          export RIPPER_BIN_DIR="$PWD/desktop/vendor/ffmpeg/win" RIPPER_APP_DATA="$PWD/appC" OPENBLAS_NUM_THREADS=24 OMP_NUM_THREADS=24 NUMBA_NUM_THREADS=24
          "$PY" -X faulthandler -m engine --analyze song.mp3; echo "exit=$?"; cat appC/engine-crash.log || true
      - name: D frozen full engine upload (24 threads, J. Test)
        continue-on-error: true
        run: |
          export RIPPER_BIN_DIR="$PWD/desktop/vendor/ffmpeg/win" OPENBLAS_NUM_THREADS=24 OMP_NUM_THREADS=24 NUMBA_NUM_THREADS=24
          export APPDATA="C:\\Users\\J. Test\\AppData\\Roaming" LOCALAPPDATA="C:\\Users\\J. Test\\AppData\\Local" USERPROFILE="C:\\Users\\J. Test"
          RIPPER_PYTHON="$PY" RIPPER_ENGINE_CMD="$PWD/engine/dist/ripper-engine/ripper-engine.exe" SMOKE_FIXTURE="$PWD/song.mp3" bash scripts/smoke.sh; echo "exit=$?"
          find /c/Users/J*Test -name 'engine-crash.log' -exec cat {} \; || true
