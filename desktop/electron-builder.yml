# electron-builder config. Build the UI + engine first (root: npm run dist:mac / dist:win).
appId: com.theripper.desktop
productName: The Ripper
executableName: the-ripper
copyright: Copyright © 2026 The Ripper
directories:
  output: release
  buildResources: assets
files:
  - src/**/*
  - assets/**/*
  - package.json
extraResources:
  - from: ../ui/dist
    to: ui
  # PyInstaller onedir output (scripts/build_engine.py) -> <resources>/engine/ripper-engine[.exe]
  - from: ../engine/dist/ripper-engine
    to: engine
  # Optional: drop ffmpeg/ffprobe binaries into desktop/vendor/ffmpeg/<platform>/ to bundle them.
  - from: vendor/ffmpeg/${os}
    to: engine
    filter: ["ffmpeg*", "ffprobe*"]
asarUnpack:
  - assets/drag.png
mac:
  category: public.app-category.music
  target:
    # Builds for the machine's own arch: the bundled PyInstaller engine can't be
    # cross-compiled, so an Intel dmg must be built on an Intel Mac.
    - target: dmg
  icon: assets/icon.png
  hardenedRuntime: true
  entitlements: entitlements.mac.plist
  entitlementsInherit: entitlements.mac.plist
dmg:
  title: The Ripper
win:
  target:
    - target: nsis
      arch: [x64]
  icon: assets/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  shortcutName: The Ripper
linux:
  target: [AppImage]
  category: Audio
  icon: assets/icon.png
