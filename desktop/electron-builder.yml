# electron-builder config. Build the UI + engine first (root: npm run dist:mac / dist:win).
appId: com.theripper.desktop
productName: The Ripper
executableName: the-ripper
copyright: Copyright © 2026 The Ripper
directories:
  output: release
  buildResources: assets
files:
  - src/**/*
  - assets/**/*
  - package.json
extraResources:
  - from: ../ui/dist
    to: ui
  # PyInstaller onedir output (scripts/build_engine.py) -> <resources>/engine/ripper-engine[.exe]
  - from: ../engine/dist/ripper-engine
    to: engine
  # Bundled helpers, next to the engine so it finds them first (engine/services/tools.py).
  # CI fills desktop/vendor/ with `python scripts/fetch_vendor.py`; see LICENSES.md.
  - from: vendor/ffmpeg/${os}
    to: engine
    filter: ["ffmpeg", "ffmpeg.exe", "ffprobe", "ffprobe.exe"]
  - from: vendor/deno/${os}
    to: engine
    filter: ["deno", "deno.exe"]
  - from: vendor/ffmpeg/${os}
    to: licenses/ffmpeg
    filter: ["LICENSE.txt", "GPL-3.0.txt", "BUILD-INFO.txt"]
  - from: vendor/deno/${os}
    to: licenses/deno
    filter: ["LICENSE.md", "BUILD-INFO.txt"]
  - from: ../LICENSES.md
    to: licenses/LICENSES.md
asarUnpack:
  - assets/drag.png
mac:
  category: public.app-category.music
  target:
    # Builds for the machine's own arch: the bundled PyInstaller engine can't be
    # cross-compiled, so an Intel dmg must be built on an Intel Mac.
    - target: dmg
  icon: assets/icon.png
  hardenedRuntime: true
  entitlements: entitlements.mac.plist
  entitlementsInherit: entitlements.mac.plist
dmg:
  title: The Ripper
win:
  target:
    - target: nsis
      arch: [x64]
  icon: assets/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  shortcutName: The Ripper
  # Uninstall removes the track library + settings (kept on updates). See assets/installer.nsh.
  include: assets/installer.nsh
linux:
  target: [AppImage]
  category: Audio
  icon: assets/icon.png
